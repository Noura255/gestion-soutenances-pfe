services:
  mysql:
    image: mysql:8.0
    container_name: sg_soutenance_mysql
    environment:
      MYSQL_DATABASE: sg_soutenance
      MYSQL_ROOT_PASSWORD: happyman3
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phappyman3"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sg_soutenance_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sg_soutenance
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: happyman3
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: sg_soutenance_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
