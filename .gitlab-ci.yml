stages:
  - test
  - build
  - docker-build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw test

backend-build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw -DskipTests package
  artifacts:
    paths:
      - backend/target/*.jar

frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

docker-build:
  stage: docker-build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t sg-soutenance-backend:$CI_COMMIT_SHORT_SHA ./backend
    - docker build -t sg-soutenance-frontend:$CI_COMMIT_SHORT_SHA ./frontend
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy:
  stage: deploy
  image: alpine:3.20
  script:
    - echo "Déploiement à brancher sur l'environnement cible après validation du pipeline."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
