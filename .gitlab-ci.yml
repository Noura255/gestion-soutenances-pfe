# ================================================================
#  GitLab CI/CD - Systeme Gestion Soutenance
#  Stages: build > test > docker > deploy
# ================================================================

stages:
  - build
  - test
  - docker
  - deploy

variables:
  DOCKER_REGISTRY: ${CI_REGISTRY}
  BACKEND_IMAGE: ${CI_REGISTRY_IMAGE}/backend
  FRONTEND_IMAGE: ${CI_REGISTRY_IMAGE}/frontend
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

# ----------------------------------------
#  STAGE 1 : BUILD
# ----------------------------------------

# ----- BACKEND -----
build_backend:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw clean package -DskipTests -B
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

# ----- FRONTEND -----
build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# ----------------------------------------
#  STAGE 2 : TEST
# ----------------------------------------

test_backend:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  needs:
    - build_backend
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw test -B
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/*.xml

# ----------------------------------------
#  STAGE 3 : DOCKER - Build & Push Images
# ----------------------------------------

.docker_base:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"

docker_backend:
  extends: .docker_base
  needs:
    - build_backend
    - test_backend
  script:
    - docker build -t $BACKEND_IMAGE:$IMAGE_TAG -t $BACKEND_IMAGE:latest ./backend
    - docker push $BACKEND_IMAGE:$IMAGE_TAG
    - docker push $BACKEND_IMAGE:latest

docker_frontend:
  extends: .docker_base
  needs:
    - build_frontend
  script:
    - docker build -t $FRONTEND_IMAGE:$IMAGE_TAG -t $FRONTEND_IMAGE:latest ./frontend
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG
    - docker push $FRONTEND_IMAGE:latest

# ----------------------------------------
#  STAGE 4 : DEPLOY
# ----------------------------------------

# --- Deploy to Staging (branch develop) ---
deploy_staging:
  stage: deploy
  image: alpine:latest
  needs:
    - docker_backend
    - docker_frontend
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$STAGING_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - ssh $STAGING_USER@$STAGING_HOST "cd /opt/sg-soutenance && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
  environment:
    name: staging
    url: http://$STAGING_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Deploy to Production (branch master) ---
deploy_production:
  stage: deploy
  image: alpine:latest
  needs:
    - docker_backend
    - docker_frontend
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$PROD_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - ssh $PROD_USER@$PROD_HOST "cd /opt/sg-soutenance && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
  environment:
    name: production
    url: http://$PROD_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual