# =============================================================
#  docker-compose.prod.yml
#  Used on the deployment server — pulls pre-built images
#  from GitLab Container Registry instead of building locally.
# =============================================================

services:
  # ---- MySQL Database ----
  db:
    image: mysql:8.0
    container_name: sgs-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: sg_soutenance
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Spring Boot Backend ----
  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}
    container_name: sgs-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sg_soutenance
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
    volumes:
      - uploads_data:/app/uploads

  # ---- React Frontend (Nginx) ----
  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${IMAGE_TAG:-latest}
    container_name: sgs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:
